name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p edsa-cli benchmark
      - run: cargo run -p edsa-cli -- benchmark mock target/benchmark-results.json
      - run: cargo run -p edsa-cli -- inspect examples/demo-evidence
      - run: cargo doc --workspace --no-deps

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  sarif-self-scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - run: pipx run semgrep scan --config p/rust --sarif --output semgrep.sarif crates
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  selected-container-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: docker pull alpine:3.20
      - run: cargo test -p edsa-sandbox docker_enforces_isolation_and_cleanup -- --ignored --exact
      - run: cargo run -p edsa-cli -- replay demo-path-traversal examples/demo-evidence
