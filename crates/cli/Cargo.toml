[package]
name = "edsa-cli"
description = "CLI for the Evidence-Driven Security Agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
edsa-agent-runtime = { path = "../agent-runtime" }
edsa-adapter-sdk = { path = "../adapter-sdk" }
edsa-core = { path = "../core" }
edsa-evidence = { path = "../evidence" }
edsa-reporting = { path = "../reporting" }
edsa-sandbox = { path = "../sandbox" }
edsa-signal-import = { path = "../signal-import" }
edsa-model-providers = { path = "../model-providers" }
async-trait.workspace = true
sha2.workspace = true
dunce = "1.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "edsa"
path = "src/main.rs"
