[package]
name = "edsa-cli"
description = "CLI for the Evidence-Driven Security Agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
edsa-reporting = { path = "../reporting" }
edsa-sandbox = { path = "../sandbox" }
serde_json.workspace = true
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7"

[lints]
workspace = true

[[bin]]
name = "edsa"
path = "src/main.rs"
